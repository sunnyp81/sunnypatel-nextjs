<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" fill="none">
  <!-- Background -->
  <rect width="680" height="280" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="279" rx="15.5" fill="none" stroke="#d6deee" stroke-width="1"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" fill="#0a1024" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">SEO Services Across Berkshire</text>
  <text x="340" y="50" text-anchor="middle" fill="#5a6478" font-family="system-ui, sans-serif" font-size="11">Local expertise covering all Thames Valley business hubs</text>

  <!-- Reading (central, largest) -->
  <rect x="240" y="72" width="200" height="64" rx="12" fill="#eef4ff"/>
  <rect x="240" y="72" width="200" height="64" rx="12" stroke="#2a5bd7" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <circle cx="268" cy="94" r="8" fill="#2a5bd7" fill-opacity="0.15"/>
  <circle cx="268" cy="94" r="3" fill="#2a5bd7"/>
  <text x="286" y="98" fill="#0a1024" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Reading</text>
  <text x="412" y="98" text-anchor="end" fill="#2a5bd7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HQ</text>
  <text x="268" y="122" fill="#5a6478" font-family="system-ui, sans-serif" font-size="10">Tech, professional services, healthcare</text>

  <!-- Row 2: Bracknell + Wokingham -->
  <rect x="40" y="150" width="190" height="52" rx="10" fill="#eef2f9"/>
  <rect x="40" y="150" width="190" height="52" rx="10" stroke="#d6deee" stroke-width="1" fill="none"/>
  <circle cx="62" cy="172" r="3" fill="#2a5bd7"/>
  <text x="76" y="176" fill="#0a1024" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Bracknell Forest</text>
  <text x="62" y="192" fill="#5a6478" font-family="system-ui, sans-serif" font-size="9">Tech parks, B2B services</text>

  <rect x="245" y="150" width="190" height="52" rx="10" fill="#eef2f9"/>
  <rect x="245" y="150" width="190" height="52" rx="10" stroke="#d6deee" stroke-width="1" fill="none"/>
  <circle cx="267" cy="172" r="3" fill="#2a5bd7"/>
  <text x="281" y="176" fill="#0a1024" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Wokingham</text>
  <text x="267" y="192" fill="#5a6478" font-family="system-ui, sans-serif" font-size="9">Growth-stage companies</text>

  <rect x="450" y="150" width="190" height="52" rx="10" fill="#eef2f9"/>
  <rect x="450" y="150" width="190" height="52" rx="10" stroke="#d6deee" stroke-width="1" fill="none"/>
  <circle cx="472" cy="172" r="3" fill="#2a5bd7"/>
  <text x="486" y="176" fill="#0a1024" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Slough</text>
  <text x="472" y="192" fill="#5a6478" font-family="system-ui, sans-serif" font-size="9">Manufacturing, professional</text>

  <!-- Row 3: Windsor + Maidenhead -->
  <rect x="140" y="216" width="200" height="52" rx="10" fill="#eef2f9"/>
  <rect x="140" y="216" width="200" height="52" rx="10" stroke="#d6deee" stroke-width="1" fill="none"/>
  <circle cx="162" cy="238" r="3" fill="#2a5bd7"/>
  <text x="176" y="242" fill="#0a1024" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Windsor</text>
  <text x="162" y="258" fill="#5a6478" font-family="system-ui, sans-serif" font-size="9">Hospitality, tourism, retail</text>

  <rect x="355" y="216" width="200" height="52" rx="10" fill="#eef2f9"/>
  <rect x="355" y="216" width="200" height="52" rx="10" stroke="#d6deee" stroke-width="1" fill="none"/>
  <circle cx="377" cy="238" r="3" fill="#2a5bd7"/>
  <text x="391" y="242" fill="#0a1024" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Maidenhead</text>
  <text x="377" y="258" fill="#5a6478" font-family="system-ui, sans-serif" font-size="9">Corporate, professional services</text>

  <!-- Connection lines from Reading to others -->
  <line x1="290" y1="136" x2="135" y2="150" stroke="#2a5bd7" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="340" y1="136" x2="340" y2="150" stroke="#2a5bd7" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="390" y1="136" x2="545" y2="150" stroke="#2a5bd7" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="290" y1="136" x2="240" y2="216" stroke="#2a5bd7" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="390" y1="136" x2="455" y2="216" stroke="#2a5bd7" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
