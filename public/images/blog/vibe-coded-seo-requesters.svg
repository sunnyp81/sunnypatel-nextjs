<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">What each requester receives from a Lovable-hosted page</title>
  <desc id="desc">Two columns. New apps, created from 13 May 2026, use server-side rendering: every request returns rendered HTML. Older React and Vite apps: people get the single-page app, verified crawlers get a pre-rendered page, and unverified bots and link checkers get the single-page app unless they request Markdown.</desc>
  <rect width="720" height="660" rx="24" fill="#080b12"/>
  <g font-family="Arial,sans-serif">
    <text x="38" y="62" fill="#f5f7fb" font-size="29" font-weight="700">What each requester receives</text>
    <rect x="32" y="96" width="328" height="470" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="56" y="136" fill="#92b2ff" font-size="20" font-weight="700">NEW APPS</text><text x="56" y="172" fill="#f5f7fb" font-size="26" font-weight="700">Server-side rendering</text><rect x="48" y="200" width="296" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="64" y="234" fill="#f5f7fb" font-size="21" font-weight="700">Visitor</text><text x="64" y="262" fill="#d4deee" font-size="20">Rendered HTML</text><rect x="48" y="318" width="296" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="64" y="352" fill="#f5f7fb" font-size="21" font-weight="700">Verified crawler</text><text x="64" y="380" fill="#d4deee" font-size="20">Rendered HTML</text><rect x="48" y="436" width="296" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="64" y="470" fill="#f5f7fb" font-size="21" font-weight="700">Unverified bot</text><text x="64" y="498" fill="#d4deee" font-size="20">Rendered HTML</text>
    <rect x="376" y="96" width="312" height="470" rx="16" fill="#2c2319" stroke="#d79f1e" stroke-width="3"/><text x="400" y="136" fill="#f2c969" font-size="20" font-weight="700">OLDER REACT + VITE APPS</text><text x="400" y="172" fill="#f5f7fb" font-size="26" font-weight="700">Pre-rendering</text><rect x="392" y="200" width="280" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="408" y="234" fill="#f5f7fb" font-size="21" font-weight="700">Visitor</text><text x="408" y="262" fill="#d4deee" font-size="20">Single-page app</text><rect x="392" y="318" width="280" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="408" y="352" fill="#f5f7fb" font-size="21" font-weight="700">Verified crawler</text><text x="408" y="380" fill="#d4deee" font-size="20">Pre-rendered page</text><rect x="392" y="436" width="280" height="104" rx="10" fill="#0f1624" stroke="#2a3550" stroke-width="2"/><text x="408" y="470" fill="#f5f7fb" font-size="21" font-weight="700">Unverified bot</text><text x="408" y="498" fill="#d4deee" font-size="20">Single-page app</text><text x="408" y="524" fill="#d4deee" font-size="20">(Markdown if asked)</text>
    <text x="38" y="604" fill="#aebbd2" font-size="19">Source: Lovable docs, SEO and AI search page, checked 24 Nov 2026.</text>
    <text x="38" y="632" fill="#aebbd2" font-size="19">New apps: created from 13 May 2026 (22 June 2026 on Enterprise).</text>
  </g>
</svg>
