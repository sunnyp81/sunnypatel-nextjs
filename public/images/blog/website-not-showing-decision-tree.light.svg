<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1826" viewBox="0 0 720 1826" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree: why a website is not showing on Google</title>
  <desc id="desc">Eight steps in order. Step 1: is the page or site new; if so read cause 10 and keep checking. Step 2: search site: plus the exact page address; if the page shows, cause 1. Step 3: open the page in a private window; a password or coming-soon page is cause 2. Step 4: a hide-from-search setting is cause 3. Step 5: read the URL Inspection status: URL is on Google is cause 1, URL blocked by robots.txt is cause 4, Crawled or Discovered or duplicate is cause 5, redirect or 404 or soft 404 or 5xx or 401 or 403 is cause 6. Step 6: Manual actions or Security issues, causes 7 and 8. Step 7: removal request, cause 9. Step 8: all clear on a site that is not new, get help.</desc>
  <rect width="720" height="1826" rx="24" fill="#f4f7fc"/>
  <g font-family="Arial,sans-serif">
    <text x="38" y="62" fill="#0d1526" font-size="29" font-weight="700">Why is my site not in Google?</text>
    <rect x="38" y="96" width="644" height="134" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="132" fill="#1f4fc4" font-size="22" font-weight="700">STEP 1</text><text x="62" y="170" fill="#0d1526" font-size="26" font-weight="700">Is the page or site new?</text><text x="62" y="214" fill="#8a5d00" font-size="24">Yes: see cause 10, then keep checking.</text><path d="M360 234 V270 M348 258 L360 272 L372 258" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="266" fill="#4a5873" font-size="22">No</text><rect x="38" y="280" width="644" height="168" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="316" fill="#1f4fc4" font-size="22" font-weight="700">STEP 2</text><text x="62" y="354" fill="#0d1526" font-size="26" font-weight="700">Does site: plus the exact page</text><text x="62" y="388" fill="#0d1526" font-size="26" font-weight="700">address show the page?</text><text x="62" y="432" fill="#8a5d00" font-size="24">Yes: it is in Google. Go to cause 1.</text><path d="M360 452 V488 M348 476 L360 490 L372 476" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="484" fill="#4a5873" font-size="22">No</text><rect x="38" y="498" width="644" height="168" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="534" fill="#1f4fc4" font-size="22" font-weight="700">STEP 3</text><text x="62" y="572" fill="#0d1526" font-size="26" font-weight="700">Does the page open in a private window</text><text x="62" y="606" fill="#0d1526" font-size="26" font-weight="700">with no password or coming-soon page?</text><text x="62" y="650" fill="#8a5d00" font-size="24">No: it is closed to visitors. Cause 2.</text><path d="M360 670 V706 M348 694 L360 708 L372 694" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="702" fill="#4a5873" font-size="22">No</text><rect x="38" y="716" width="644" height="134" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="752" fill="#1f4fc4" font-size="22" font-weight="700">STEP 4</text><text x="62" y="790" fill="#0d1526" font-size="26" font-weight="700">Is a hide-from-search setting on?</text><text x="62" y="834" fill="#8a5d00" font-size="24">Yes: it is told to stay out. Cause 3.</text><path d="M360 854 V890 M348 878 L360 892 L372 878" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="886" fill="#4a5873" font-size="22">No</text><rect x="38" y="900" width="644" height="270" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="936" fill="#1f4fc4" font-size="22" font-weight="700">STEP 5</text><text x="62" y="974" fill="#0d1526" font-size="26" font-weight="700">What does URL Inspection say</text><text x="62" y="1008" fill="#0d1526" font-size="26" font-weight="700">about that page?</text><text x="62" y="1052" fill="#8a5d00" font-size="24">URL is on Google: cause 1</text><text x="62" y="1086" fill="#8a5d00" font-size="24">URL blocked by robots.txt: cause 4</text><text x="62" y="1120" fill="#8a5d00" font-size="24">Crawled, Discovered or duplicate: cause 5</text><text x="62" y="1154" fill="#8a5d00" font-size="24">Redirect, 404, soft 404, 5xx, 401, 403: cause 6</text><path d="M360 1174 V1210 M348 1198 L360 1212 L372 1198" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="1206" fill="#4a5873" font-size="22">Anything else</text><rect x="38" y="1220" width="644" height="168" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="1256" fill="#1f4fc4" font-size="22" font-weight="700">STEP 6</text><text x="62" y="1294" fill="#0d1526" font-size="26" font-weight="700">Does Manual actions or Security</text><text x="62" y="1328" fill="#0d1526" font-size="26" font-weight="700">issues list a problem?</text><text x="62" y="1372" fill="#8a5d00" font-size="24">Yes: causes 7 and 8.</text><path d="M360 1392 V1428 M348 1416 L360 1430 L372 1416" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="1424" fill="#4a5873" font-size="22">No</text><rect x="38" y="1438" width="644" height="134" rx="16" fill="#e3ecfb" stroke="#2f5fd9" stroke-width="3"/><text x="62" y="1474" fill="#1f4fc4" font-size="22" font-weight="700">STEP 7</text><text x="62" y="1512" fill="#0d1526" font-size="26" font-weight="700">Is a removal request listed?</text><text x="62" y="1556" fill="#8a5d00" font-size="24">Yes: cause 9.</text><path d="M360 1576 V1612 M348 1600 L360 1614 L372 1600" fill="none" stroke="#5b6b88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="1608" fill="#4a5873" font-size="22">No</text><rect x="38" y="1622" width="644" height="134" rx="16" fill="#fbf1d9" stroke="#c8921a" stroke-width="3"/><text x="62" y="1658" fill="#8a5d00" font-size="22" font-weight="700">STEP 8</text><text x="62" y="1696" fill="#0d1526" font-size="26" font-weight="700">All clear and the site is not new?</text><text x="62" y="1740" fill="#8a5d00" font-size="24">Get help: see the last section.</text>
    <text x="38" y="1800" fill="#4a5873" font-size="20">Quickest checks first. Source: Google Search Console Help.</text>
  </g>
</svg>
