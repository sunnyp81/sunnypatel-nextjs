<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1608" viewBox="0 0 720 1608" role="img" aria-labelledby="title desc">
  <title id="title">Ten-minute decision tree: why a website is not showing on Google</title>
  <desc id="desc">Seven steps in order. Step 1: a site: search. If pages show, go to cause 1. Step 2: open the site in a private window. If it asks for a password or shows a coming-soon page, cause 2. Step 3: check for a hide-from-search setting, cause 3. Step 4: read the URL Inspection result for the homepage: robots.txt is cause 4, crawled or discovered or duplicate is cause 5, redirect or not found is cause 6. Step 5: Manual actions or Security issues, causes 7 and 8. Step 6: removal request, cause 9. Step 7: a new site with nothing found is cause 10.</desc>
  <rect width="720" height="1608" rx="24" fill="#080b12"/>
  <g font-family="Arial,sans-serif">
    <text x="38" y="62" fill="#f5f7fb" font-size="29" font-weight="700">Why is my site not in Google?</text>
    <rect x="38" y="96" width="644" height="168" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="132" fill="#92b2ff" font-size="22" font-weight="700">STEP 1</text><text x="62" y="170" fill="#f5f7fb" font-size="26" font-weight="700">Does a site: search show</text><text x="62" y="204" fill="#f5f7fb" font-size="26" font-weight="700">any of your pages?</text><text x="62" y="248" fill="#f2c969" font-size="24">Yes: it is in Google. Go to cause 1.</text><path d="M360 268 V304 M348 292 L360 306 L372 292" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="300" fill="#aebbd2" font-size="22">No</text><rect x="38" y="314" width="644" height="168" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="350" fill="#92b2ff" font-size="22" font-weight="700">STEP 2</text><text x="62" y="388" fill="#f5f7fb" font-size="26" font-weight="700">Does your site open in a private window</text><text x="62" y="422" fill="#f5f7fb" font-size="26" font-weight="700">with no password or coming-soon page?</text><text x="62" y="466" fill="#f2c969" font-size="24">No: it is closed to visitors. Cause 2.</text><path d="M360 486 V522 M348 510 L360 524 L372 510" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="518" fill="#aebbd2" font-size="22">No</text><rect x="38" y="532" width="644" height="134" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="568" fill="#92b2ff" font-size="22" font-weight="700">STEP 3</text><text x="62" y="606" fill="#f5f7fb" font-size="26" font-weight="700">Is a hide-from-search setting on?</text><text x="62" y="650" fill="#f2c969" font-size="24">Yes: it is told to stay out. Cause 3.</text><path d="M360 670 V706 M348 694 L360 708 L372 694" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="702" fill="#aebbd2" font-size="22">No</text><rect x="38" y="716" width="644" height="236" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="752" fill="#92b2ff" font-size="22" font-weight="700">STEP 4</text><text x="62" y="790" fill="#f5f7fb" font-size="26" font-weight="700">What does URL Inspection say</text><text x="62" y="824" fill="#f5f7fb" font-size="26" font-weight="700">about your homepage?</text><text x="62" y="868" fill="#f2c969" font-size="24">Blocked by robots.txt: cause 4</text><text x="62" y="902" fill="#f2c969" font-size="24">Crawled, discovered or duplicate: cause 5</text><text x="62" y="936" fill="#f2c969" font-size="24">Redirect or not found (404): cause 6</text><path d="M360 956 V992 M348 980 L360 994 L372 980" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="988" fill="#aebbd2" font-size="22">None of these</text><rect x="38" y="1002" width="644" height="168" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="1038" fill="#92b2ff" font-size="22" font-weight="700">STEP 5</text><text x="62" y="1076" fill="#f5f7fb" font-size="26" font-weight="700">Does Manual actions or Security</text><text x="62" y="1110" fill="#f5f7fb" font-size="26" font-weight="700">issues list a problem?</text><text x="62" y="1154" fill="#f2c969" font-size="24">Yes: causes 7 and 8.</text><path d="M360 1174 V1210 M348 1198 L360 1212 L372 1198" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="1206" fill="#aebbd2" font-size="22">No</text><rect x="38" y="1220" width="644" height="134" rx="16" fill="#11263a" stroke="#5b8aef" stroke-width="3"/><text x="62" y="1256" fill="#92b2ff" font-size="22" font-weight="700">STEP 6</text><text x="62" y="1294" fill="#f5f7fb" font-size="26" font-weight="700">Is a removal request listed?</text><text x="62" y="1338" fill="#f2c969" font-size="24">Yes: cause 9.</text><path d="M360 1358 V1394 M348 1382 L360 1396 L372 1382" fill="none" stroke="#9aacbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="1390" fill="#aebbd2" font-size="22">No</text><rect x="38" y="1404" width="644" height="134" rx="16" fill="#2c2319" stroke="#d79f1e" stroke-width="3"/><text x="62" y="1440" fill="#f2c969" font-size="22" font-weight="700">STEP 7</text><text x="62" y="1478" fill="#f5f7fb" font-size="26" font-weight="700">Nothing found and the site is new?</text><text x="62" y="1522" fill="#f2c969" font-size="24">Cause 10: wait, add a sitemap.</text>
    <text x="38" y="1582" fill="#aebbd2" font-size="20">Quickest checks first. Source: Google Search Console Help.</text>
  </g>
</svg>
