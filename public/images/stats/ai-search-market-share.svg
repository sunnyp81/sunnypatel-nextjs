<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <clipPath id="chart-clip-ai">
      <rect x="0" y="0" width="720" height="420" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#chart-clip-ai)">
    <!-- Background -->
    <rect width="720" height="420" fill="#0a0a0f" rx="16" ry="16"/>

    <!-- Title -->
    <text x="36" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AI Referral Traffic Share by Platform, 2026</text>
    <text x="36" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e0e0e0" opacity="0.5">Source: SE Ranking, 101,574 websites, Jan 2025 to Apr 2026 (published June 2026)</text>

    <!-- Donut chart centered at 300, 225 with radius 120, stroke-width 44 -->
    <!-- Circumference = 2 * PI * 120 = 753.98 -->
    <!-- ChatGPT: 74.78% = 563.83, Gemini: 11.56% = 87.16, Perplexity: 7.23% = 54.51 -->
    <!-- Copilot: 3.51% = 26.46, Claude: 2.62% = 19.75, Other: 0.30% = 2.26 -->

    <!-- Background ring -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#1a1a24" stroke-width="44"/>

    <!-- ChatGPT: 74.78% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#5B8AEF" stroke-width="44"
      stroke-dasharray="563.83 190.15"
      stroke-dashoffset="188.50"
      stroke-linecap="butt"/>

    <!-- Gemini: 11.56% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#d79f1e" stroke-width="44"
      stroke-dasharray="87.16 666.82"
      stroke-dashoffset="-375.33"
      stroke-linecap="butt"/>

    <!-- Perplexity: 7.23% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#5a922c" stroke-width="44"
      stroke-dasharray="54.51 699.47"
      stroke-dashoffset="-462.49"
      stroke-linecap="butt"/>

    <!-- Copilot: 3.51% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#4c7894" stroke-width="44"
      stroke-dasharray="26.46 727.52"
      stroke-dashoffset="-517.00"
      stroke-linecap="butt"/>

    <!-- Claude: 2.62% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#c46b3a" stroke-width="44"
      stroke-dasharray="19.75 734.23"
      stroke-dashoffset="-543.46"
      stroke-linecap="butt"/>

    <!-- Other: 0.30% -->
    <circle cx="300" cy="225" r="120" fill="none" stroke="#6b6b7b" stroke-width="44"
      stroke-dasharray="2.26 751.72"
      stroke-dashoffset="-563.21"
      stroke-linecap="butt"/>

    <!-- Inner dark circle to complete donut look -->
    <circle cx="300" cy="225" r="98" fill="#0a0a0f"/>

    <!-- Center text -->
    <text x="300" y="220" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">0.32%</text>
    <text x="300" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#e0e0e0" opacity="0.5" text-anchor="middle">of all website traffic is AI referral</text>

    <!-- Legend (right side) -->
    <circle cx="480" cy="110" r="6" fill="#5B8AEF"/>
    <text x="496" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">ChatGPT</text>
    <text x="640" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">74.78%</text>

    <circle cx="480" cy="146" r="6" fill="#d79f1e"/>
    <text x="496" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">Gemini</text>
    <text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">11.56%</text>

    <circle cx="480" cy="182" r="6" fill="#5a922c"/>
    <text x="496" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">Perplexity</text>
    <text x="640" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">7.23%</text>

    <circle cx="480" cy="218" r="6" fill="#4c7894"/>
    <text x="496" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">Copilot</text>
    <text x="640" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">3.51%</text>

    <circle cx="480" cy="254" r="6" fill="#c46b3a"/>
    <text x="496" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">Claude</text>
    <text x="640" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">2.62%</text>

    <circle cx="480" cy="290" r="6" fill="#6b6b7b"/>
    <text x="496" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e0e0e0">Other</text>
    <text x="640" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">0.30%</text>

    <!-- Branding -->
    <text x="684" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5B8AEF" opacity="0.35" text-anchor="end">sunnypatel.co.uk</text>
  </g>
</svg>
