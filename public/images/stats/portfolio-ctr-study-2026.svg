<title id="title">Google CTR by average-position bucket: a portfolio sample</title>
<desc id="desc">Twelve historical buckets from 53 qualifying Search Console properties, 9 April to 7 July 2026. No country filter or brand exclusion. CTR ranges from 0.04 to 8.61 percent. Position one has just five query rows. Exact data and limitations are available at https://sunnypatel.co.uk/blog/google-ctr-study/.</desc>
