<title id="title">Google zero-click searches across six countries</title><desc id="desc">United Kingdom: 69.5%; United States: 68.0%; France: 65.3%; Canada: 63.8%; Italy: 63.4%; Germany: 62.1%. Browser-based panel; excludes Google mobile app. Published June 2026. Shared method says January to April 2026 but labels that line US; UK period not separately confirmed.</desc>
