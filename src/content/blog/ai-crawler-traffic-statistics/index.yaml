title: 'AI Crawler Traffic Statistics: How Much Bots Take and Send Back'
metaTitle: 'AI Crawler Traffic Statistics: Bots vs Referrals'
description: >-
  Cloudflare, Vercel and Hostinger figures on AI crawler requests and
  crawl-to-refer ratios by operator, each with its network, period and source,
  plus the crawler definitions from OpenAI, Anthropic, Perplexity and Google.
ogImage: '/images/blog/hero-ai-crawler-traffic-statistics.webp'
date: '2026-11-24'
lastUpdated: '2026-11-24'
tags:
  - Statistics
  - AI Crawlers
