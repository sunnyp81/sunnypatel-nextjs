title: 'AI Referral Sources in GA4: The Versioned List and Regex I Use'
metaTitle: 'AI Referral Sources in GA4: List and Regex (v1.0)'
description: >-
  The 15 AI assistant referrer sources I count in GA4, a copy-paste regex, and
  how my total compares with GA4's AI Assistant channel. Version 1.0, 2 Nov 2026.
ogImage: /images/blog/hero-ai-referral-sources-ga4.webp
date: '2026-11-02'
lastUpdated: '2026-11-02'
