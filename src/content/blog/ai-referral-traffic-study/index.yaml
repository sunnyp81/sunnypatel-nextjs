title: AI Referral Traffic Study
metaTitle: 'AI Referral Traffic Study: 4,717 Sessions, 12 Sites, 90 Days'
description: >-
  Real GA4 data on AI referral traffic: 4,717 sessions from ChatGPT, Copilot,
  Perplexity, Claude and Gemini across the 12 most-cited sites in my portfolio,
  measured over 90 days. Which assistants send traffic, which niches win, and
  why AI referral traffic survived a Google core update that crashed organic
  clicks on 2 of these sites.
