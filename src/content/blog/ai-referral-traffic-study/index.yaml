title: AI Referral Traffic Study
metaTitle: 'AI Referral Traffic Study: 5,240 Sessions, 12 Sites, 90 Days'
description: >-
  Real GA4 data on AI referral traffic: 5,240 sessions from ChatGPT, Copilot,
  Perplexity, Claude and Gemini across the 12 most-cited sites in my portfolio,
  measured over 90 days. Which assistants send traffic, which niches win, and
  what it means for your AI visibility.
ogImage: ''
date: '2026-08-02'
