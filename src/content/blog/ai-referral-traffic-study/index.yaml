faqs:
  - question: Which AI assistant sends the most referral traffic?
    answer: >-
      In this dataset, ChatGPT sent 90% of all AI referral sessions (4,250 of
      4,717 across 12 sites in 90 days to 26 August 2026). Microsoft Copilot
      was a distant second at 5%, then Perplexity at 3% and Claude at 2%.
      Gemini sent almost nothing: 6 sessions across the entire dataset.
  - question: What kind of websites get the most AI referral traffic?
    answer: >-
      Condition-led informational sites with structured, factual data
      dominated. A health and wellness site (1,357 sessions) and an education
      data site (993 sessions) led the table. Sites answering specific
      questions with checkable data earned far more AI citations than
      commercial or review-led sites in the same portfolio.
  - question: Does AI referral traffic survive a Google core update?
    answer: >-
      In this dataset, yes. Two sites in the table lost most of their Google
      organic clicks to a core update during the measurement window. Their AI
      referral sessions did not fall with them, one held steady, the other
      only dropped in line with the portfolio-wide average. Google ranking and
      AI citation are measured differently, and a core update does not
      automatically remove a site from the source list AI assistants already
      cite.
  - question: Does AI referral traffic show the full impact of AI search?
    answer: >-
      No. Referral sessions only count users who click through from an AI
      answer. Many AI answers resolve the query without a click, and Bing
      Copilot citations in particular convert to brand impressions rather than
      visits. Treat referral data as the floor of AI visibility, not the
      ceiling.
