  - SEO Data
  - LLM
faqs:
  - question: What share of website traffic actually comes from AI assistants?
    answer: >-
      Across a 108-property portfolio frame (104 sites with measurable
      sessions) over 90 days to 21 September 2026, sources matching five
      declared AI assistants accounted for 1.84% of all sessions, or 7.99
      AI-attributed sessions for every 100 organic-search sessions. The
      median individual site's AI-attributed share was 0.65% of its own
      sessions, and 36 of the 104 sites recorded zero matched AI sessions in
      the window. The traffic concentrates in a small number of sites: the
      top 10 sites alone carried 77.1% of all AI-matched sessions.
  - question: Which AI assistant sends the most referral traffic?
    answer: >-
      ChatGPT-matched sources accounted for 86.8% of the 6,165 AI-attributed
      sessions measured across the full panel (chatgpt.com and openai
      sources combined). Microsoft Copilot was second at 7.4%, Perplexity
      third at 3.4%, Claude 1.7%, and Gemini 0.7%. Two external benchmarks
      cited in Finding 1 (BrightEdge: 95.1% ChatGPT share of AI referral
      traffic in August 2026; Similarweb: about 53% of worldwide visits to
      AI platforms in May 2026) measure different populations and
      denominators from this panel, but agree that ChatGPT is dominant.
  - question: How does this compare to the original 12-site edition?
    answer: >-
      The original 2 August 2026 edition, refreshed 26 August 2026, measured
      a hand-picked panel of the 12 highest-AI-traffic sites in the
      portfolio, not a representative sample. Those 12 properties are
      included in the full 104-site panel above and also reported separately
      as a comparison. One important caveat: this edition's window and the
      first edition's window overlap by 64 of their 90 and 91 days
      respectively, so the comparison is mostly the same period measured
      twice with a shifted edge, not an independent before/after. Re-measured
      over the new window, those same 12 sites produced 3,872 AI-attributed
      sessions against 4,717 originally published; given the overlap, that
      alone does not establish a falling trend.
  - question: Does this study capture all AI visibility?
    answer: >-
      No. It counts GA4 sessions whose source label matches five declared
      assistants. It does not measure unclicked answers or citations, cannot
      identify every session with lost referrer attribution, and cannot
      separate Google AI Overviews or AI Mode sessions from ordinary Google
      organic search in this extraction. The size of that omitted activity
      is not quantified here.
