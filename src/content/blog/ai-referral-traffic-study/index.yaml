title: AI Referral Traffic Study
metaTitle: 'AI Referral Traffic Study: 1.84% of Sessions, 104 Sites'
description: >-
  GA4 data, 104 sites: AI sent 1.84% of sessions, 7.99 per 100 organic, in 90
  days to 21 Sep 2026. By assistant, sector, and vs the original 12-site
  panel.
ogImage: /images/blog/hero-ai-referral-traffic-study.webp
date: '2026-08-02'
lastUpdated: '2026-09-25'
tags:
  - AI Search
  - AEO
