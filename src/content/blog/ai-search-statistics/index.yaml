faqs:
  - question: How many AI searches happen per day?
    answer: >-
      ChatGPT handles about 2.5 billion prompts a day (OpenAI, July 2025), and Perplexity's last published figure was 30 million queries a day, or 780 million a month (Perplexity CEO, June 2025). Google has not published a daily query figure for AI Overviews, Gemini or AI Mode, only user counts: 2.5 billion monthly users for AI Overviews, 1 billion for AI Mode and 900 million for the Gemini app (Google I/O, May 2026). For comparison, Google handles more than 5 trillion searches a year, roughly 13.7 billion a day (Google, March 2025).
  - question: How many people use AI search in 2026?
    answer: >-
      ChatGPT reached 900 million weekly active users in February 2026 (OpenAI) and 1 billion monthly active app users in May 2026 (Sensor Tower estimate, reported by Reuters). The Gemini app passed 900 million monthly users and Google AI Overviews 2.5 billion (Google I/O, May 2026). In the UK, 54% of adults now use AI tools such as ChatGPT, Copilot or Gemini (Ofcom, April 2026). Despite this, AI platforms send only 0.32% to 1.08% of website traffic (SE Ranking, Conductor, 2026).
  - question: What is Google's search market share compared with AI search in 2026?
    answer: >-
      Google holds 91.1% of the worldwide search engine market and Bing 4.5% as of August 2026 (Statcounter). AI platforms are not counted in that share because they are not search engines, but by volume ChatGPT's 2.5 billion daily prompts are about 18% of Google's roughly 13.7 billion daily searches. AI referral traffic to websites is 0.32% of the total across 101,574 sites (SE Ranking, June 2026).
  - question: How often do Google AI Overviews appear in 2026?
    answer: >-
      AI Overviews appeared on 25.11% of the 21.9 million US Google searches in Conductor's 2026 benchmark, on 48% of the queries BrightEdge tracks (February 2026), and on 20%+ of all US searches in SparkToro's January to April 2026 data. Health care queries trigger them most at 48.75%, real estate least at 4.48% (Conductor). The spread reflects different query samples rather than disagreement about the trend.
  - question: Do AI Overviews reduce organic clicks?
    answer: >-
      Yes. Organic click-through rate fell from 1.76% to 0.61%, a 61% drop, when an AI Overview appeared, and paid CTR fell 68% (Seer Interactive, data to September 2025). Seer's April 2026 update found uncited brands lost 67% of organic CTR over 2025, while cited brands earned 120% more organic clicks per impression than uncited brands on the same page. Pew Research found users clicked a result on 8% of visits with an AI summary against 15% without (July 2025).
  - question: What percentage of Google searches end without a click?
    answer: >-
      68.01% of US Google searches ended with zero clicks in the first four months of 2026, up from 60.45% in 2024 (SparkToro, Similarweb data, June 2026). The UK is higher at 69.5%, the highest of the six countries SparkToro measured, with Germany lowest at 62.1%. Fewer than one in three Google searches now sends a click to any website.
  - question: Which websites are cited most often in AI answers?
    answer: >-
      In Google AI Overviews, YouTube takes 22.9% of citations, Reddit 18.5%, Facebook 10.1%, Google's own properties 8.8% and Wikipedia 4.0% (Ahrefs, 3 million+ US queries, September 2026). Across eight AI platforms, though, 57% of all citations go to brand-owned websites rather than social or media sites (Profound, 11.84 billion citations, July 2026). Reddit was the most cited single domain across ChatGPT, AI Mode and Perplexity in Semrush's 2025 study.
  - question: Do AI search engines cite the same pages that rank on Google?
    answer: >-
      Largely no. Only 12% of URLs cited by ChatGPT, Gemini and Copilot rank in Google's top 10 for the same query, and about 80% do not rank in Google's top 100 at all (Ahrefs, 15,000 prompts, August 2025). Perplexity is the most Google-aligned at 28.6% overlap. AI systems weight directness, factual precision and freshness over backlink-based ranking signals, so a page buried on Google can still be the primary AI citation.
