title: How Much Traffic Comes From AI Search? Real Portfolio Data
metaTitle: 'AI Search Traffic Share: Real Data From 20 Sites'
description: >-
  AI assistants sent 2.1% of sessions across 20 sites in 90 days, 3.4%
  excluding one bot-skewed site. ChatGPT sent more than every other
  assistant combined.
ogImage: /images/blog/hero-ai-search-traffic.webp
date: '2026-09-18'
lastUpdated: '2026-09-18'
tags:
- AI Search
- GEO
- Analytics
faqs:
  - question: What share of website traffic comes from AI assistants like ChatGPT?
    answer: >-
      Across a 20-site sample I track, AI assistants sent 2.1% of sessions
      over 90 days, rising to 3.4% once one bot-skewed site is excluded.
      Per-site share ranged from 0% to 10.7%, so a single portfolio-wide
      number hides more than it shows.
  - question: Does AI-referred traffic convert as well as Google traffic?
    answer: >-
      This sample can't answer that at portfolio scale; most sites don't
      have comparable goal tracking. One data point exists: sunnypatel.co.uk
      logged 68 AI-referral sessions out of 1,442 in 90 days, with 3 goal
      completions from ChatGPT. That's one site, not enough to generalise.
  - question: Why would my own GA4 show 0% AI referral traffic?
    answer: >-
      Two likely reasons. Low overall traffic volume means a handful of
      AI-referred visits wouldn't register as a percentage yet. Or GA4's
      default channel groupings can bury chatgpt.com, perplexity.ai and
      claude.ai referrals inside broader "Organic Search" or "Referral"
      buckets. Check session source directly before concluding a site gets
      no AI traffic.
