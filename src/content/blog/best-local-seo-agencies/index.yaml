faqs:
  - question: Which is the best local SEO agency in the UK?
    answer: >-
      The best fit depends on your business model and the work required. Compare
      dedicated local services, relevant evidence and delivery capacity. Sunny
      Patel, the author of this guide, and Tom Riley offer direct consultant
      support. The comparison also includes agencies with local, multi-location
      and integrated marketing services. This is an editorial shortlist rather
      than an independently tested ranking.
  - question: How much should a small business budget for local SEO?
    answer: >-
      Request a quote for your locations, website work and reporting requirements.
      Sunny Patel's local SEO service currently starts at £600 per month, with
      one-off setup projects from £800. These are published starting prices for
      one provider, not a UK market average. Confirm the scope, minimum term,
      additional costs and VAT treatment before comparing proposals.
  - question: Does an agency have to be near my business?
    answer: >-
      No. A remote provider can deliver local SEO when it understands your market
      and can implement the agreed work. A nearby team can help with site visits,
      photography or meetings. Ask who handles those tasks and whether they are
      included in the fee.
  - question: Can an agency guarantee a top-three Google Maps position?
    answer: >-
      No agency controls Google's local results. Searcher location, relevance,
      prominence and competition affect visibility. A provider can make contractual
      commitments about its work, but those are different from controlling a map
      position or guaranteeing enquiries. Ask how rankings will be measured.
  - question: How long does local SEO take?
    answer: >-
      Use the first 90 days to review the baseline, implementation and early
      evidence. The time needed for measurable business results depends on the
      starting point, competition, locations and resources. Profile issues or
      technical dependencies can delay progress. Agree milestones rather than
      accepting a fixed ranking deadline.
  - question: Can an online-only business have a Google Business Profile?
    answer: >-
      Generally no. Google Business Profile eligibility is intended for businesses
      that receive customers in person or travel to customers, subject to Google's
      category-specific rules. A mailing address alone does not make an online-only
      business eligible. Check the current guidelines before creating profiles.
