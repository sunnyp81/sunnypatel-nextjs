faqs:
  - question: Which is the best SEO company in the UK?
    answer: >-
      The best fit depends on your scope and delivery needs. NOVOS and Distinctly
      are candidates for ecommerce, SALT.agency and Screaming Frog for technical
      work, and Aira and Impression for integrated marketing. Compare relevant
      evidence, the proposed team and the full cost before deciding. This is an
      editorial shortlist, not an independently tested ranking.
  - question: Which SEO company should a small business choose?
    answer: >-
      Choose a provider that can deliver your highest-priority work within your
      budget. A focused consultant engagement or a one-off project may suit a
      small business better than a broad retainer. Confirm implementation,
      reporting and the named person responsible. An agency is useful when you
      need several specialists or ongoing production capacity.
  - question: Do I need an SEO company near me or in London?
    answer: >-
      No. Location matters when you need in-person work or specific local-market
      knowledge, but it doesn't establish SEO quality. Compare relevant results
      and delivery arrangements first. Blue Array lists Reading and London
      offices; Aira is based in Milton Keynes and Candour in Norwich. Confirm
      meeting arrangements directly with your chosen provider.
  - question: What is an independent SEO agency?
    answer: >-
      The term usually describes an agency outside a larger marketing group.
      Ownership structures vary, so ask who owns the company and who will deliver
      your work. Ownership alone doesn't establish service quality, senior access
      or value. Builtvisible announced its acquisition by Brave Bison in March 2025.
  - question: Can an SEO company guarantee rankings or AI citations?
    answer: >-
      No provider can control search rankings or guarantee permanent inclusion in
      AI answers. Ask for a specific delivery plan, repeated measurement and clear
      reporting of uncertainty. Treat guaranteed first-place claims as a reason
      to investigate further.
  - question: How long should I give an SEO agency?
    answer: >-
      Agree review points around your starting position and scope. Use the first
      90 days to check the baseline, implementation and early evidence. A complex
      migration, new site and established store have different needs. Don't treat
      a fixed contract length as a guarantee of results or accept months of reports
      without agreed work being delivered.
