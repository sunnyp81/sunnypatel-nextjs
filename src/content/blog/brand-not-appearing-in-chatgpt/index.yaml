faqs:
  - question: How long does it take to appear in ChatGPT answers?
    answer: >-
      There is no guaranteed timetable. Search answers may need a recrawl or
      index update before they reflect a change. Answers based on training are
      different, and editing a website does not schedule a model update.
      Record the product, mode and dates when comparing sampled answers.
  - question: Does ranking number 1 on Google mean I'll appear in AI answers?
    answer: >-
      No. A ranking position does not guarantee a citation in a particular
      generated answer. Check the actual answer and its sources. Clear,
      supported information is useful for readers, but it does not establish
      a fixed selection rule or a required content age.
  - question: What is an llms.txt file and do I need one?
    answer: >-
      An llms.txt file sits in your site's root directory and lists what your
      site is about, what topics you cover, and where to find key content.
      Google says it does not use these files for Search visibility. For
      another product, check its documented use before investing time in the
      file. It is not a substitute for accessible pages or supported answers.
  - question: Will AI search replace Google entirely?
    answer: >-
      This diagnostic cannot predict that. Measure the search exposure,
      assistant referrals and actual enquiries your business receives, then
      decide where an improvement is worth testing. A growing industry
      trend is not a forecast of your own site's return.
