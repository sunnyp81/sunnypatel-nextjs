faqs:
  - question: Are ChatGPT prompts actually useful for SEO?
    answer: >-
      ChatGPT prompts can help draft keyword groups, briefs, rewrites and
      technical suggestions when you provide the task, source material and
      required output. Check facts, intent, links and code before using the
      result. The 20-template library has not been evaluated as a controlled
      ranking or AI-citation experiment, so a usable draft is the immediate
      outcome to assess.

  - question: Can I use these prompts with Claude or Gemini instead of ChatGPT?
    answer: >-
      Yes. The templates use general instructions rather than a ChatGPT-specific
      API. Try them in Claude or Gemini with the same source material and checks.
      Browsing, analytics access and output quality depend on the product, mode
      and permissions; selecting Gemini does not automatically connect a prompt to
      your Google data.

  - question: Is AI-generated SEO content ready to publish as-is?
    answer: >-
      No. Treat AI-generated SEO content as a draft. Check its facts, sources,
      usefulness, links and any code before publishing. Accurate data and editing
      support quality, but do not guarantee search rankings. Take particular care
      with health, finance and legal claims, where an incorrect answer can harm
      the reader.

  - question: What order should I run these prompts in?
    answer: >-
      Start with verified queries and intent, assign the questions to existing or
      proposed URLs, then create a brief and draft. Review each output before
      passing it onward. Finish with fact, link and schema checks. This sequence
      organises the work; it does not establish that publishing the output will
      build authority or improve rankings.
