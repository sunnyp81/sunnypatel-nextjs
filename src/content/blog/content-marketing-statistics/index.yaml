faqs:
  - question: What is the ROI of content marketing in 2026?
    answer: >-
      It depends what's being measured. SEO-driven content returns an average
      748% over three years (First Page Sage, 2026). Content marketing overall,
      across every channel and format, returns $7.65 for every $1 spent, lower
      because it includes formats that don't compound the way indexed,
      evergreen content does. Organic leads close at 14.6%, against 1.7% for
      outbound leads.
  - question: Do B2B and B2C companies use content marketing differently?
    answer: >-
      Adoption is close: 91% of B2B marketers and roughly 70% of B2C marketers
      use content marketing. The real gap is execution, not adoption. Only 47%
      of B2B marketers have a documented content strategy (Content Marketing
      Institute, 2026), so most of that 91% is publishing without a written
      plan.
  - question: How often should you publish blog content?
    answer: >-
      Consistency matters more than volume. Orbit Media's data shows bloggers
      publishing multiple times a week report stronger results than weekly or
      monthly publishers. Published client case data from one UK agency shows
      weekly-blogging sites growing from 162 to 2,000 monthly visits in under
      five months and 1,246 to 10,000 within a year, though these are
      individual cases, not a guaranteed outcome.
  - question: Does AI-generated content rank as well as human-written content?
    answer: >-
      Not on its own. Semrush's April 2026 study of 42,000 posts found
      human-written content holds Google's #1 position 80% of the time versus
      10% for pure AI content, and unedited AI content ranks roughly 23% lower
      than human-authored pieces on the same keywords. AI content with
      substantive human editing, original data and expert attribution performs
      within 4% of fully human-written content.
  - question: How much of my marketing budget should go to content?
    answer: >-
      CMI's 2026 B2B benchmark report (1,015 marketers) found the median
      company allocates 18% of marketing budget to content, with
      top-performing programmes at 11-30%. Businesses investing 25-30% of
      budget in content generate roughly 3 times the inbound leads of those
      investing under 10%.
  - question: Is blogging still worth it with AI Overviews and zero-click search?
    answer: >-
      Yes, but the target has shifted. 68% of Google searches now end without
      a click, and AI Overviews cut organic CTR by 61% when they appear. Brands
      actually cited inside an AI Overview see 35% more clicks than a normal
      listing at the same position, so the goal is being specific and sourced
      enough to get cited, not only ranking.
