faqs:
  - question: How long does the routine take each week?
    answer: >-
      Three hours across three one-hour sessions. The first month is slower
      because you fill in baselines, and after that each session repeats the
      same steps.
  - question: Do I need paid SEO tools to use the workbook?
    answer: >-
      No. Every number comes from Google Search Console, GA4 or Google Business
      Profile, which are free. The free tools linked in the sessions run in
      your browser.
  - question: Can I use the workbook in Excel instead of Google Sheets?
    answer: >-
      Yes. It is a standard .xlsx file with dropdowns, formulas and frozen
      header rows that work in Excel, and Google Sheets keeps them on import.
  - question: Can the workbook guarantee rankings?
    answer: >-
      No. It gives you a process and a record, so you can see which changes
      helped. Rankings depend on Google and your competitors, so I cannot
      promise a result.
