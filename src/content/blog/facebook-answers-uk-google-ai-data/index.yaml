faqs:
  - question: What is Facebook Answers?
    answer: >-
      Facebook Answers is a directory of pages at facebook.com/fb-answers/.
      Each page is labelled "Summarized by Meta AI" and turns public Facebook
      posts and comments on one question into a written answer, with the
      posts quoted underneath. Google indexes the pages and shows them in
      normal results, AI Overviews and AI Mode.
  - question: How much UK Google traffic does Facebook Answers get?
    answer: >-
      Ahrefs estimated 1,874,164 monthly UK organic visits to
      facebook.com/fb-answers/ on 25 November 2026, from 486,210 UK
      keywords, 142,504 of them in the top 3. The estimate was 0 in the week
      of 4 May 2026. These are Ahrefs modelled estimates, not Meta's own
      analytics.
  - question: Does ChatGPT cite Facebook Answers?
    answer: >-
      Almost never in Ahrefs data. On 25 November 2026 Ahrefs recorded 0
      ChatGPT citations of fb-answers pages in the UK and 7 worldwide,
      against 109,237 UK citations in Google AI Overviews and 28,821 in
      Google AI Mode. The AI visibility is Google's own AI surfaces.
  - question: Do Facebook Answers pages have backlinks?
    answer: >-
      Very few. Of the top 30,000 UK fb-answers pages by estimated traffic, 3
      had any referring domain in the Ahrefs export of 25 November 2026. In
      the US top 30,000 the figure was 52. The pages rank on the strength of
      the facebook.com domain, not links to the pages themselves.
  - question: Should UK businesses copy the Facebook Answers approach?
    answer: >-
      No. The pages rank on one of the strongest domains on the web, they
      are new, and in the UK export 4,822 pages had already lost all their
      estimated traffic. Google's spam policies name scaled content abuse.
      The useful lesson is to publish clear, checkable answers to the basic
      questions people ask about your business on your own site.
