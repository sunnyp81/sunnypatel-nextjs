title: 'Google CTR by Position: Benchmarks, Caveats and How to Measure Your Own'
metaTitle: 'Google CTR by Position: Benchmarks and Caveats'
description: >-
  What AWR, First Page Sage and Sistrix report for CTR by position, why our
  portfolio figures were withdrawn, and how to build your own benchmark.
ogImage: '/images/blog/hero-google-ctr-study.webp'
date: '2026-07-10'
lastUpdated: '2026-09-25'
