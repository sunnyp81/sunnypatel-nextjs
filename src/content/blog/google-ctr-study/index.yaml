faqs:
  - question: What CTR does Google's position one actually get?
    answer: >-
      It depends which study and market you read. Advanced Web Ranking
      (US, desktop, July 2026) reports 20.02%. First Page Sage (US,
      blended, Mar-Aug 2026) reports 7.1%. Sistrix (mobile, 80 million
      keywords) reports 28.5%. AWR and First Page Sage cover the US; none
      of the three establishes a UK benchmark, and country, device and
      brand handling all move the figure.
  - question: Why were this page's own CTR figures withdrawn?
    answer: >-
      The July 2026 collection had no UK filter, no brand exclusion, an
      unpaginated 5,000-row cap ordered by clicks, and a position-one
      bucket built from just five rows. A September 2026 re-extraction
      fixed those problems and still found the panel too concentrated in
      one property and too thin on query-level click coverage to support
      a reliable benchmark; see the Correction section for the exact
      figures behind that decision.
  - question: How do I exclude branded clicks from my own Search Console data?
    answer: >-
      Use the query dimension's custom regex filter set to "doesn't
      match", with a pattern covering your brand name and its common
      misspellings. Exclude brand queries when building a non-brand
      benchmark.
  - question: Does Search Console show every query that got clicks?
    answer: >-
      No. Search Console omits anonymised queries, and reporting limits
      can omit additional rows. Compare query-level clicks with
      property-level clicks for the same dates, country, device and
      search type, and document any query filter you apply, since a
      filter also removes anonymised queries from the property-level
      total.
  - question: Can I use a published CTR study as my own target?
    answer: >-
      Treat it as a reference point, not a target. Sistrix reports
      position-one CTR ranging from 13.7% to 46.9% depending on SERP
      layout, about a 5.3-percentage-point reduction with a featured
      snippet present, and 27% without an AI Overview against 11% with
      one present in its German data. None of the studies on this page
      establishes a UK benchmark. Your own filtered Search Console data
      can fit your situation better once its sample size and coverage
      are sufficient.
