faqs:
  - question: What CTR did the position-one bucket record?
    answer: >-
      The rounded position-one bucket recorded 43 clicks from 721 impressions:
      5.96% CTR across five query rows. It is a small portfolio observation with
      no country filter or explicit brand exclusion. It is not a universal target.
  - question: Is this a UK non-brand CTR benchmark?
    answer: >-
      No. The collection applied neither a UK country filter nor an explicit
      brand exclusion. The retained aggregate does not establish its country or
      brand mix. Descriptions of this edition as a UK non-brand benchmark have
      been corrected.
  - question: Does position four outperform position one?
    answer: >-
      Position four had higher CTR in this sample. The buckets contain different
      query groups, so their percentages do not show that a lower ranking causes
      more clicks. The data cannot predict the effect of moving the same query.
  - question: Does the table include every portfolio query?
    answer: >-
      No. The script requested up to 5,000 rows per property without pagination
      and retained returned rows with at least 50 impressions. Search Console
      also limits which queries it returns. The published table contains all
      retained bucket totals, not all underlying search activity.
  - question: Can I reuse the table and chart?
    answer: >-
      Yes. Reuse the published aggregate table and our chart with a link to this
      study. Keep the measurement dates, sample sizes and limitations with the
      figures. CSV, JSON, PNG and SVG downloads are available without registration.
