faqs:
  - question: How many referring domains does a small owned site actually have?
    answer: >-
      Across 28 owned portfolio sites pulled via Ahrefs on 24 September 2026,
      the median was 601.5 referring domains, but median Domain Rating across
      the same panel was only 0.6. Most of the referring-domain volume on
      these sites is templated spam, not earned links, so the raw count on
      its own tells you almost nothing about real link building.
  - question: What share of small-site referring domains are dofollow?
    answer: >-
      Median dofollow share across the 28-site panel was 10.5%. In the subset
      of panel sites with a Domain Rating of 2 or higher, the median dofollow
      share rose to 30%, since sites with any real organic footprint tend to
      carry a healthier mix of earned, followed links alongside the spam.
  - question: How can I tell if a backlink spike is spam or real link building?
    answer: >-
      Check three things from this data. Timing: real link building grows
      gradually, spam and negative SEO tend to arrive as a sudden step-change
      repeated across unrelated sites in the same month. Anchor text: PBN and
      link-seller templates repeat near-verbatim across sites. Page target:
      spam links overwhelmingly point at the homepage, real editorial links
      point at the specific page that answers the query.
  - question: Do more referring domains mean better rankings?
    answer: >-
      Not in this dataset. The site with the smallest, slowest-growing
      referring-domain count in the panel (15 total, gradual growth over
      eight months) also carried a Domain Rating of 8 and roughly five times
      the organic traffic of a higher-RD site in the same panel whose links
      arrived mostly as a spam spike. Link quality and timing mattered more
      than raw count.
  - question: How many real links does a citation-worthy statistics page need?
    answer: >-
      On sunnypatel.co.uk, three statistics pages checked fresh on 24
      September 2026 carried 23, 9 and 8 referring domains respectively
      across all URL variants. These are small, realistic numbers for a
      genuinely useful reference page, and a fraction of the inflated counts
      spam alone produces on the portfolio panel sites in this study.
  - question: Can I reuse these link building statistics?
    answer: >-
      Cite this page and keep the panel size (28 sites), the pull date (24
      September 2026) and each metric's stated scope attached to any figure
      you quote. The CSV and JSON downloads are ungated and contain aggregate
      statistics only, with no domain names.
