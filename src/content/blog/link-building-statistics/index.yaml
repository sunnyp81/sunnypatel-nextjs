faqs:
  - question: Which page types hold the most referring domains on sunnypatel.co.uk?
    answer: >-
      Checked on 24 September 2026, 5 stats and data pages hold 31 unique
      referring domains combined. The other 21 non-homepage pages with any
      referring domain (articles, service pages, landing pages and
      portfolio pages) hold 24 combined. Page age and promotion were not
      controlled for.
  - question: How many referring domains does each statistics page hold?
    answer: >-
      sunnypatel.co.uk's UK SEO statistics page holds 12 unique referring
      domains, local SEO statistics holds 8, and AI search statistics holds
      7, each counted once per domain across every live URL variant of that
      page, checked 24 September 2026.
  - question: Do free tools hold referring domains on this site?
    answer: >-
      No tool URL appeared with a referring domain in this pull, checked 24
      September 2026, against 31 unique referring domains across the site's
      5 stats and data pages.
  - question: Why do raw referring-domain counts mislead?
    answer: >-
      A referring-domain total does not say how a link was placed. A saved
      review of anchor text on a wider panel of owned sites flagged
      sampled anchors containing backlink-sales terms or references to the
      same SEO vendor, appearing on 8 of 9 reviewed sites. Anchor text can
      describe a link's surrounding page, but it cannot prove who placed a
      link or why.
  - question: How was the anchor pattern checked, and how common is it?
    answer: >-
      10 of the 28 panel sites have a Domain Rating of 2 or higher. Anchor
      text and 12 months of referring-domain history were reviewed for 9 of
      those 10. The flagged anchor wording appeared on 8 of the 9. 6 of the
      9 had a month where referring domains rose by more than 130 in that
      single month.
  - question: Can I reuse this data?
    answer: >-
      Cite this page and keep the pull date (24 September 2026) and each
      metric's stated scope attached to any figure you quote. The CSV and
      JSON downloads are ungated and list aggregate figures only, with no
      domain names other than sunnypatel.co.uk.
