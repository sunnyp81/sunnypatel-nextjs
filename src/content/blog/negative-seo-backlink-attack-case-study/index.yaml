title: What an 83% Spam Backlink Blast Has Done to This Site (So Far)
metaTitle: 'Negative SEO Case Study: 763 Backlinks, 83% Spam, No Visible Damage'
description: >-
  An Ahrefs export found 763 referring domains on sunnypatel.co.uk, 83%
  flagged as spam. The dataset, the three spam patterns behind it, and
  what Search Console shows so far.
ogImage: /images/blog/hero-negative-seo-case-study.webp
