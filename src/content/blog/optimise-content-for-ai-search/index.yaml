title: Optimise Content for AI Search
metaTitle: 'How to Optimise Content for AI Search'
description: >-
  How Google AI Overviews, ChatGPT, and Perplexity actually select and cite
  sources in 2026, and the content structure, schema, and measurement changes
  that follow from it.
