faqs:
  - question: What is the difference between GEO, AEO, and SEO?
    answer: >-
      SEO covers discoverability and performance in search. AEO often
      describes answering questions in search features and assistants. GEO
      describes discovery and accurate use in generated answers. The labels
      overlap; ranking, citation and recommendation remain separate outcomes.
  - question: Does llms.txt actually help you get cited by AI search?
    answer: >-
      Google says it ignores llms.txt for Search visibility. For another
      product, check its documented use. Do not promise a citation improvement
      from the file or prioritise it over accessible pages and supported answers.
  - question: Does Google Search Console show AI Overview data now?
    answer: >-
      The Generative AI report includes impressions for AI Overviews and
      AI Mode. Google's help page dates worldwide rollout to 31 August 2026.
      It does not provide an AI-click total. Page and property aggregation
      differ, and exported zeros can represent unavailable values.
  - question: How do I measure whether my content gets cited by AI search?
    answer: >-
      Bing reports citations across supported AI surfaces. Search Console
      reports AI Overview and AI Mode impressions. GA4 records identifiable
      assistant referral sessions. Keep those metrics separate and add actual
      answer captures. Missing referral information is an unmeasured gap,
      not a reason to relabel Direct sessions as AI traffic.
