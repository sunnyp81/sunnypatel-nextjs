faqs:
  - question: What is Google's search market share in the UK?
    answer: >-
      Statcounter recorded Google at 91.75% of UK search-engine referrals in
      August 2026. This measures clicked referrals to participating sites, not
      all queries or users. Separately, the CMA found Google handled more than
      90% of traditional UK search queries through June 2025.
  - question: What percentage of UK Google searches end without a click?
    answer: >-
      SparkToro and Similarweb reported 69.5% in their June 2026 UK analysis.
      The panel excludes Google mobile-app searches. Its shared methodology
      states January-April 2026 but labels that line US, so the UK period is
      not separately confirmed.
  - question: What is a good organic click-through rate?
    answer: >-
      A useful CTR benchmark matches the country, device, query intent and
      ranking definition of your own data. My portfolio's position-one
      bucket recorded 5.96% from just five query rows. The extraction has no
      country or explicit brand filter, so this is not a universal UK target.
  - question: How much is spent on search advertising in the UK?
    answer: >-
      IAB UK and Oliver Wyman reported £17.9bn in UK search advertising
      expenditure for 2025, representing 44% of digital ad spend. This
      measures paid search investment rather than SEO agency revenue.
  - question: Can I reuse these SEO statistics and charts?
    answer: >-
      Cite the original source and retain the geography, measurement date
      and denominator. The CSV and JSON are ungated. Our chart can be reused
      with linked credit to Sunny Patel, SparkToro and Similarweb; underlying
      studies retain their own publisher terms.
