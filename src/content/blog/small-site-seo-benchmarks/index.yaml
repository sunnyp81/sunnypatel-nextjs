faqs:
  - question: What share of pages on a small site get no clicks from Google?
    answer: >-
      87.9% of pages with impressions recorded zero clicks in 12 months for the
      median site (p25 to p75: 78.5% to 96.3%). That covers 84 of the 100
      websites I own that have Google Search Console data. These are the sites
      with 10 or more pages with impressions. This describes my own sites and
      not the web.
  - question: How long does a new page take to get its first click?
    answer: >-
      11 days was the median time to a first click among new pages that
      clicked within 90 days of their first impression (p25 to p75: 0 to 40
      days, n = 1,336). Only 8.3% of eligible new pages (1,336 of 16,046) got a
      click within 90 days. The new-page measure is a rough proxy. Treat the
      timings as a guide.
  - question: Do a few pages really bring in most of a site's clicks?
    answer: >-
      96.1% is the median share of 12-month clicks coming from the top 10% of
      pages (p25 to p75: 83.5% to 100%, n = 76 sites with any clicks). That is
      a yes on my sites.
  - question: How many top-3 queries get no clicks?
    answer: >-
      344 of 421 queries (81.7%) with 10 or more impressions and an average
      position of 3 or better got no click in 12 months, 30 October 2025 to 29
      October 2026. That covers the 32 of my 100 sites that had such queries.
      Google hides anonymised queries and position is a 12-month average, so
      treat it as a guide.
  - question: Can I use these figures as a benchmark for my own site?
    answer: >-
      100 websites I own that have Google Search Console data make up the
      sample. It is mostly UK affiliate and programmatic sites and leaves out
      dead and sold sites. Use the figures as a reference point. The page
      explains how to compute the same two shares from your own Pages export.
