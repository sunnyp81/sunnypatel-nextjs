title: UK AI Overviews by Industry 2026
metaTitle: "UK AI Overviews by Industry 2026: 399-Query Study"
description: >-
  Google AI Overview presence across 10 UK sectors from a locked,
  multi-topic 399-query panel, plus which kinds of sources AI Overviews
  cite. Download the CSV and JSON.
ogImage: '/images/blog/hero-uk-ai-overviews-by-industry.webp'
date: '2026-09-25'
lastUpdated: '2026-09-25'
tags:
  - AI Overviews
  - AI Search
