title: 'How Many Businesses Are There in the UK? 2026 Figures'
metaTitle: 'How Many UK Businesses Are There? 2026 Figures'
description: >-
  The official 2026 count of UK private sector businesses by size, legal form,
  industry and region, set beside 2025, with what the figures include and leave
  out and why the ONS count is different.
