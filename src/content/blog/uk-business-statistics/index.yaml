faqs:
  - question: How many businesses are there in the UK?
    answer: >-
      The official estimate is 5,586,835 private sector businesses at the start of 2026, which the release rounds to 5.6 million. It comes from the Business population estimates 2026 statistical release, published on 5 November 2026 by the Department for Business, Innovation, Science and Trade. That is 104,000 (1.8%) fewer than the 5,690,265 in the 2025 release. The release says it cannot confidently state there has been a fall in the real business population.
  - question: How many UK businesses have no employees?
    answer: >-
      4,115,175 of the 5,586,835 private sector businesses had no employees at the start of 2026, which the release gives as 74%. The other 1,471,660 (26%) had at least one employee. The no-employee group includes sole proprietorships, partnerships of self-employed owners and companies with one employee, who is assumed to be a working proprietor.
  - question: How many UK businesses are small or medium-sized?
    answer: >-
      SMEs, meaning businesses with 0 to 249 employees, numbered 5,578,480, or 99.85% of the private sector. The release counts 39,220 medium-sized businesses (50 to 249 employees) and 8,355 large businesses (250 or more). In the release, small means 0 to 49 employees and includes businesses with no employees.
  - question: Why does the ONS give a different number of UK businesses?
    answer: >-
      The ONS counts a different group at a different date. Its bulletin of 24 September 2026 reports 2,786,985 businesses registered for VAT and/or PAYE in March 2026, and that count includes government and non-profit bodies. The 5,586,835 figure covers the private sector only and adds an estimate of unregistered businesses, which are 2.9 million of the total. Quote the source and date with whichever one you use.
  - question: Did the number of UK businesses grow in 2026?
    answer: >-
      No. The 2026 estimate is lower than 2025 (5,586,835 against 5,690,265), and the release reports a decrease of 104,000 (1.8%). The fall comes mainly from unregistered businesses, which are estimated from survey data, and the release says it cannot confidently state there has been a fall in the real business population. Registered businesses increased by 51,000 (1.9%).
