faqs:
  - question: How many dentists are registered in the UK in 2026?
    answer: >-
      The General Dental Council's register held 47,022 dentists as of the
      January 2026 annual renewal figures, up 3.2% on the 45,580 recorded a
      year earlier. The register has grown faster than the UK training
      pipeline alone, with more than half of dentists who joined in 2025
      qualified internationally. (Source: General Dental Council, 2026)
  - question: What proportion of dental practices in England still offer NHS treatment?
    answer: >-
      55.6% of England's roughly 10,160 dental practices offered NHS general
      dentistry in 2026, down from 64.6% in 2017. The NHS has lost at least
      600 practices holding a general contract since 2017, while practices
      operating without an NHS general contract have grown by more than
      1,000. This figure is England-specific; no equivalent UK-wide figure
      covering Scotland, Wales, and Northern Ireland could be verified.
      (Source: Nuffield Trust, 2026)
  - question: Is there reliable data on how UK patients find a dentist, search versus referral?
    answer: >-
      No. Several marketing agency pages publish specific splits, such as
      Google search driving a stated share of new patients, but none trace
      back to a named study, sample size, or fieldwork date. The GDC's own
      2022 public survey covers access, affordability, and confidence in
      dentistry but does not measure discovery channel. What exists instead
      is general local-service-business search data, not a dental-specific
      figure.
  - question: What is the click-through rate for each position in the Google Local Pack?
    answer: >-
      Position 1 in the Local Pack gets a 17.8% click-through rate, position
      2 gets 13.6%, and position 3 gets 10.4% (Source: BrightLocal, 2026).
      Separately, the Local Pack as a whole captures roughly 42% of all
      clicks on a local results page, a different measurement from the
      per-position rates rather than a sum of them (Source: Backlinko,
      2026). This is general local business data, not a dental-specific
      figure, but it applies directly because dental search carries
      overwhelmingly local intent.
  - question: Is there a reliable UK figure for dental patient acquisition cost?
    answer: >-
      No credible UK-specific figure could be verified. Several agency pages
      publish a specific cost-per-patient or percentage-of-revenue marketing
      spend figure, but none cite a named survey or dataset behind the
      number. The best verifiable adjacent data point is that average net
      profit per principal in private dental practices grew more than 22%
      year on year, evidence the private dental market is currently a
      reasonable one to invest marketing budget into. (Source: Nuffield
      Trust, 2026)
  - question: Does search engine volume exist for "dental marketing statistics UK"?
    answer: >-
      No measured UK search volume exists for "dental marketing statistics
      uk" or close variants, checked via Ahrefs in September 2026. This page
      was built as a sourced reference for dental practices and referral
      partners rather than as a keyword-volume play.
