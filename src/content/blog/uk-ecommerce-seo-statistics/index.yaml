faqs:
  - question: What percentage of UK retail sales happen online?
    answer: >-
      28.8% of total retail sales in Great Britain were made online in September 2026, down
      from 28.9% in August 2026 (ONS, Retail Sales Great Britain bulletin,
      published 23 October 2026). That is
      still well above the roughly 20% share online retail held before 2020.
  - question: How big is the UK ecommerce market?
    answer: >-
      Estimates vary widely by methodology. Mordor Intelligence values the UK
      ecommerce market at USD 317.3 billion for 2026, with a 9.41% compound
      annual growth rate forecast for 2027 to 2032, while a comparison across Mordor Intelligence,
      IMARC Group, eMarketer, EcommerceDB and Statista shows a range from
      roughly USD 152.5 billion to USD 297 billion, built on Mordor's earlier
      USD 265.14 billion 2025 estimate rather than its updated 2026 figure, so
      the two figures are different forecast vintages rather than a single
      comparable range. Treat the growth rate as more reliable than any
      single absolute figure.
  - question: Which ecommerce platform has the largest market share in the UK?
    answer: >-
      Wix Stores leads UK ecommerce software adoption with roughly a quarter
      of tracked sites, with Shopify in second place and
      WooCommerce Checkout third, according to Statista's UK ecommerce
      software tracker (August 2026). Magento (Adobe Commerce) has a much smaller store
      count but concentrates among larger, higher-SKU catalogues.
  - question: What is a good ecommerce conversion rate in the UK?
    answer: >-
      The UK and Irish average was 1.97% in September 2026, up from 1.68% in
      September 2025, a 17.25% year-on-year rise (IRP Commerce). Conversion
      rate varies enormously by category: in the same month, for example,
      arts and crafts converted at 5.76% against 0.44% for baby and child
      products, so compare your store against
      its own category rather than a flat national average.
  - question: What is the average cart abandonment rate?
    answer: >-
      70.22%, based on Baymard Institute's aggregation of 50 separate studies.
      In Baymard's own shopper survey, extra costs for shipping, tax or fees
      are the most common reason for abandoning during checkout (40%), ahead
      of slow delivery (20%), distrust of entering card details (19%) and
      forced account creation (18%).
  - question: How much of UK ecommerce sales happen on mobile?
    answer: >-
      Mobile accounted for 61.4% of UK and Irish ecommerce sales by device in
      September 2026, against 37.1% desktop and 1.5% tablet (IRP Commerce).
      IRP Commerce doesn't state whether the split is based on transaction
      count or revenue value.
