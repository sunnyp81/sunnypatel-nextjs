faqs:
  - question: What percentage of UK retail sales happen online?
    answer: >-
      28.3% of total UK retail sales were made online in July 2026, down from
      29.2% in June 2026 (ONS, Retail Sales Great Britain bulletin). That is
      still well above the roughly 20% share online retail held before 2020.
  - question: How big is the UK ecommerce market?
    answer: >-
      Estimates vary widely by methodology. Mordor Intelligence values the UK
      ecommerce market at USD 317.33 billion for 2026, growing at a 9.72%
      compound annual rate, while a comparison across Mordor Intelligence,
      IMARC Group, eMarketer, EcommerceDB and Statista shows a range from
      roughly USD 152.5 billion to USD 297 billion depending on what each
      tracker counts as ecommerce. Treat the growth rate as more reliable than
      any single absolute figure.
  - question: Which ecommerce platform has the largest market share in the UK?
    answer: >-
      Wix Stores leads UK ecommerce software adoption with roughly a quarter
      of tracked sites, with Shopify close behind in second place and
      WooCommerce Checkout third, according to Statista's BuiltWith-sourced UK
      tracker (August 2026). Magento (Adobe Commerce) has a much smaller store
      count but concentrates among larger, higher-SKU catalogues.
  - question: What is a good ecommerce conversion rate in the UK?
    answer: >-
      The UK and Irish average was 2.26% in July 2026, up 16.17% year on year
      from 1.94% (IRP Commerce). Conversion rate varies enormously by
      category, from around 5% in arts and crafts down to under 1% in
      categories like baby and child products, so compare your store against
      its own category rather than a flat national average.
  - question: What is the average cart abandonment rate?
    answer: >-
      70.22%, based on Baymard Institute's aggregation of 50 separate studies.
      The figure has stayed broadly stable for years, with unexpected extra
      costs at checkout, forced account creation and long checkout flows the
      most commonly cited reasons shoppers abandon a purchase.
  - question: How much of UK ecommerce sales happen on mobile?
    answer: >-
      Mobile accounted for 62.3% of UK and Irish ecommerce sales by device in
      July 2026, against 36.3% desktop and 1.4% tablet (IRP Commerce). Other
      trackers put mobile's share of transactions slightly lower, around
      55-57%, depending on whether sales are measured by transaction count or
      value.
