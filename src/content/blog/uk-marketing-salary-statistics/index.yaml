faqs:
  - question: What is the median marketing salary in the UK?
    answer: >-
      The UK median gross annual salary for marketing and commercial
      managers was £50,589 in 2025, up 6.7% on 2024, according to ONS ASHE
      2025 provisional data (Table 14). Marketing, sales and advertising
      directors had a higher median of £90,000 in the same release.
  - question: How much does an SEO specialist earn in the UK?
    answer: >-
      SOC 2020 has no separate SEO occupation code. Most in-house SEO
      executives and specialists are coded within marketing associate
      professionals (SOC 3554), which had a UK median of £30,479 in 2025
      provisional ASHE data. SEO managers and heads of SEO are more likely
      coded within marketing and commercial managers (SOC 2432), median
      £50,589. Treat both as proxies, not an SEO-specific measurement.
  - question: When is the next ONS earnings release?
    answer: >-
      The ONS "Employee earnings in the UK: 2026" release, covering ASHE
      2026 provisional and 2025 revised results, is scheduled for 22
      October 2026 at 9:30am. It had not been published as of 24 September
      2026, so this page uses the 2025 provisional edition, published 23
      October 2025.
  - question: Does this data include self-employed SEO consultants and freelancers?
    answer: >-
      No. ASHE samples employee jobs through PAYE records and excludes the
      self-employed entirely. For published UK consultant pricing, see how
      much an SEO consultant charges in the UK; this page does not
      estimate consultant rates from ASHE.
  - question: How much do marketing salaries vary by UK region?
    answer: >-
      For marketing associate professionals (SOC 3554), London's 2025
      provisional median was £35,000 against £28,013 in the North West,
      around 25% higher. Several regional cells for other marketing
      occupations are suppressed by ONS due to small sample sizes and are
      not zero.
  - question: Can I reuse these salary statistics?
    answer: >-
      Cite Sunny Patel and link to this page alongside the underlying ONS
      ASHE release. The CSV and JSON downloads are ungated. ONS retains its
      own Open Government Licence terms for the underlying dataset.
