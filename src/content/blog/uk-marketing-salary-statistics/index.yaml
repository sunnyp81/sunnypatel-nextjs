faqs:
  - question: What is the median marketing salary in the UK?
    answer: >-
      The UK median gross annual salary for full-time marketing and
      commercial managers was £55,215 in 2026, up 1.9% on 2025, according
      to ONS ASHE 2026 provisional data (Table 14). Marketing, sales and
      advertising directors had a higher full-time median of £96,393 in
      the same release.
  - question: How much does an SEO specialist earn in the UK?
    answer: >-
      SOC 2020 has no separate SEO occupation code. Most in-house SEO
      executives and specialists are coded within marketing associate
      professionals (SOC 3554), which had a full-time UK median of £35,000
      in 2026 provisional ASHE data. SEO managers and heads of SEO are
      more likely coded within marketing and commercial managers (SOC
      2432), full-time median £55,215. Both figures are approximate
      occupational proxies for SEO pay.
  - question: When is the next ONS earnings release?
    answer: >-
      ONS has not yet announced the date of its next earnings release. The
      latest, "Employee earnings in the UK: 2026", covering ASHE 2026
      provisional and 2025 revised results, was published on 22 October
      2026 and is the edition this page uses. The 2026 ASHE reference
      period is the pay period that included 22 April 2026. The 2026
      regional table (Table 15) had not been published by 23 October 2026,
      so the regional figures here are still 2025 provisional.
  - question: Does this data include self-employed SEO consultants and freelancers?
    answer: >-
      No. ASHE samples employee jobs through PAYE records and excludes the
      self-employed entirely. For published UK consultant pricing, see how
      much an SEO consultant charges in the UK; this page does not
      estimate consultant rates from ASHE.
  - question: How much do marketing salaries vary by UK region?
    answer: >-
      For marketing associate professionals (SOC 3554), London's 2025
      provisional full-time median was £36,870 against £29,291 in the
      North West, around 26% higher. ONS had not published 2026 regional
      figures (Table 15) by 23 October 2026. Several regional cells for other
      marketing occupations are suppressed by ONS due to small sample
      sizes and are not zero.
  - question: Why does this page use full-time pay instead of all employees?
    answer: >-
      Full-time gross annual pay matches how most people search for and
      compare salary figures. ASHE also publishes an all-employee figure
      blending full-time and part-time jobs, which is lower because
      part-time pay pulls it down; the two bases are not directly
      comparable.
  - question: Can I reuse these salary statistics?
    answer: >-
      Cite Sunny Patel and link to this page alongside the underlying ONS
      ASHE release. The CSV and JSON downloads are ungated. ONS retains its
      own Open Government Licence terms for the underlying dataset.
