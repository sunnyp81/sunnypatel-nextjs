  - value: 84%
    label: Survey respondents using or planning to use AI tools
    source: Stack Overflow Developer Survey 2025, n = 33,662
  - value: 72%
    label: Respondents who say they are not vibe coding
    source: Stack Overflow Developer Survey 2025, n = 26,564
  - value: 56%
    label: Average security pass rate of raw AI models in a vendor test
    source: Veracode GenAI Code Security Report, 28 July 2026
faqs:
  - question: How many developers vibe code?
    answer: >-
      Most say they do not. In the Stack Overflow Developer Survey 2025, 72.2% of the 26,564 respondents who answered said vibe coding is not part of their professional work. 11.9% said yes, 2.8% said yes somewhat and 0.4% said yes emphatically. The survey defined vibe coding as generating software from LLM prompts. The 2026 survey page has no vibe coding question.
  - question: Is AI-generated code insecure?
    answer: >-
      One vendor test says raw models often write code that fails a security check. Veracode's 2026 report reported an average security pass rate of 56% across the models it has tracked, with no security-specific prompting. Its 11-model leaderboard ranged from 50% to 68%. The tests ran against raw models and not agents or production environments with tooling, guardrails or human review.
  - question: Do developers trust AI-generated code?
    answer: >-
      Less than they use it. In the Stack Overflow 2025 survey, 46% of 33,244 respondents distrusted the accuracy of AI tools and 33% trusted it. In the DORA 2025 survey, 24% reported a great deal or a lot of trust in AI-generated output and 30% reported a little or none. The two surveys asked different questions, so I do not combine them.
  - question: Who coined the term vibe coding?
    answer: >-
      Andrej Karpathy used the term in a post on X on 2 February 2025. He wrote that there is a new kind of coding he calls vibe coding, where you fully give in to the vibes, embrace exponentials and forget that the code even exists.
