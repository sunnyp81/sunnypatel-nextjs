title: 'Why Is My Website Not Showing on Google? A 10-Minute Diagnosis'
metaTitle: 'Website Not Showing on Google? 10-Minute Diagnosis'
description: >-
  A seven-step decision tree for UK business owners: ten causes of a website
  missing from Google, how to tell which applies, and the free fix for each.
