faqs:
  - question: How do I check if my website is on Google?
    answer: >-
      Type site:yourdomain.co.uk into Google with your own domain. Pages in the
      list mean the site is in Google. Google says the operator "doesn't
      necessarily return all the URLs that are indexed", so confirm with the
      URL Inspection tool in Search Console.
  - question: How long does a new website take to show on Google?
    answer: >-
      Google gives a range of "a day or two to a few weeks, typically,
      depending on many factors". Its URL Inspection help says indexing
      "typically takes only a day or so, but can take much longer in some
      cases". Google also says to allow at least a week after submitting a
      sitemap or an index request before assuming a problem. No one can
      promise a date.
  - question: Why does my website show for my business name but not for my services?
    answer: >-
      The site is probably indexed and not ranking for those searches. Google
      says "Many people assume that they are not on Google, when in fact their
      page simply appears low in Search results". Search for the exact page
      address to confirm. The job is then ranking work.
  - question: Can I pay Google to show my website?
    answer: >-
      Not for ordinary search results. Google says it "doesn't accept payment to
      crawl a site more frequently, or rank it higher". Google Ads is a separate
      paid service that shows adverts, and it does not fix a site that is
      missing from search results. Fix the cause in Search Console instead.
  - question: Does a robots.txt file keep my page out of Google?
    answer: >-
      No. Google says robots.txt "is not a mechanism for keeping a web page out
      of Google". To keep a page out, "block indexing with noindex or
      password-protect the page".
  - question: Does fixing indexing get my business into Google AI answers?
    answer: >-
      Indexing is the first step and not a guarantee. Google says a page must be
      "indexed and eligible to be shown in Google Search with a snippet" and
      that there are no additional requirements to appear in AI Overviews or AI
      Mode.
