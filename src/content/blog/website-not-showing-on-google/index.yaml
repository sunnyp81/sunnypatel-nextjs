title: 'Why Is My Website Not Showing on Google? A Step-by-Step Diagnosis'
metaTitle: 'Website Not Showing on Google? Step-by-Step Diagnosis'
description: >-
  A step-by-step decision tree for UK business owners: ten causes of a website
  missing from Google, how to tell which applies, and what to do about each.
