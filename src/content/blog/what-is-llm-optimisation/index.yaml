faqs:
  - question: Is LLM optimisation the same as model optimisation?
    answer: >-
      No. The phrase has two meanings and search results mix them. Engineers
      use "LLM optimisation" for changes to a model or how it runs. Marketers
      use it for changes to the websites and content that a model reads.
  - question: What do LLM optimisation services include?
    answer: >-
      An LLM optimisation service should start with measurement and a written
      scope. Ask for a prompt set, an access review, specific content fixes and
      repeat measurement of citations, brand mentions, referral visits and
      enquiries.
