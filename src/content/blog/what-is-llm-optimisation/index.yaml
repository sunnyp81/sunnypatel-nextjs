title: What is LLM Optimisation
metaTitle: 'LLM Optimisation: Get Cited in AI Answers, Not Model Tuning'
description: >-
  LLM optimisation in SEO helps ChatGPT, Gemini and AI Overviews find and cite your pages accurately. What it covers, how to measure it and what it costs.
