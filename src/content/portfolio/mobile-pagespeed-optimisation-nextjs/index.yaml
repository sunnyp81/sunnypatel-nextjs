year: '2026'
problem: >-
  My AI search statistics page dropped to a 76 mobile PageSpeed score after I
  added interactive charts, glow cards and a light theme. First paint took 3.0
  seconds and the hero image took 5.0 seconds on a throttled phone. The desktop
  score was still 100, so the slowdown only showed on mobile.
solution: >-
  I profiled the page in PageSpeed Insights and local Lighthouse, then fixed the
  four things holding up the first screen: the analytics script, the table of
  contents code, the hover animation library and the hero image priority. Every
  fix changed when, or in what order, code loads. None of them changed how the page looks.
result: >-
  Mobile PageSpeed went from 76 to 90. First Contentful Paint fell from 3.0s to
  1.4s, Largest Contentful Paint from 5.0s to 3.5s, and Cumulative Layout Shift
  stayed at 0. Accessibility, Best Practices and SEO all held at 100.
